name: Verify master More contract

on:
  push:
    branches:
      - fix/master-more-contract-20260930

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Master More contract
        run: node tools/test_master_more_contract.js
      - name: Master UI polish compatibility
        run: node tools/test_master_ui_polish_84_100.js
      - name: Master UI cleanup diagnostic
        continue-on-error: true
        run: node tools/test_master_ui_cleanup_84_99.js
      - name: Syntax
        run: |
          node --check js/next/smart_action_hub.js
          node --check js/next/pages/cabinet.js
          node --check js/boot/runtime_shell_bundle.js
          node --check tools/test_master_more_contract.js
          php -l tools/release_gate.php
      - name: Generated shell parity
        run: |
          node tools/build_boot_js_bundles.js
          git checkout -- js/boot/runtime_onboarding_bundle.js js/boot/runtime_identity_bundle.js js/boot/runtime_ui_bundle.js js/boot/runtime_core_bundle.js
          git diff --exit-code -- js/boot/runtime_shell_bundle.js
