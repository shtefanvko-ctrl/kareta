name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - import/kareta-current-84.142
      - release/reconcile-84.152

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-gate:
    name: verification-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax
        run: |
          find api inc -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/kareta-php-lint.log
          tail -n 20 /tmp/kareta-php-lint.log

      - name: JavaScript syntax
        run: |
          node --check js/next/route_registry.js
          node --check js/next/shell_nav.js
          node --check js/next/app_next.js
          node --check js/next/catalog/catalog_state.js
          node --check js/next/pages/masters.js
          node --check js/next/community/community_state.js
          node --check js/next/pages/community.js
          node --check js/mobile_native_bridge.js
          node --check js/next/pages/diagnostics.js
          node --check js/next/pages/not_found.js
          node --check js/boot/runtime_identity_bundle.js
          node --check js/boot/runtime_shell_bundle.js

      - name: Harness change intelligence
        run: |
          node --check tools/harness_plan.js
          node --check tools/harness_evidence.js
          node --check tools/harness_verdict.js
          node --check tools/harness_receipt.js
          node --check tools/harness_collect_receipts.js
          node --check tools/harness_approval.js
          node --check tools/harness_authorize.js
          node --check tools/test_harness_change_intelligence.js
          node --check tools/test_harness_impact_evidence.js
          node --check tools/test_harness_verdict.js
          node --check tools/test_harness_receipt.js
          node --check tools/test_harness_collect_receipts.js
          node --check tools/test_harness_approval.js
          node --check tools/test_harness_permission_matrix.js
          node tools/test_harness_change_intelligence.js
          node tools/test_harness_impact_evidence.js
          node tools/test_harness_verdict.js
          node tools/test_harness_receipt.js
          node tools/test_harness_collect_receipts.js
          node tools/test_harness_approval.js
          node tools/test_harness_permission_matrix.js

      - name: Android Native API 6 contract
        run: node tools/test_android_native_api6_contract_84_148.js

      - name: Migration contract
        run: |
          php tools/test_migration_contract.php
          php tools/test_release_migration_manifest.php
          php tools/test_migration_collision_bridge_84_149.php

      - name: Dispatch service constraints
        run: |
          php tools/test_dispatch_service_constraints.php
          php tools/test_dispatch_location_constraints.php

      - name: Legacy authorization no-growth
        run: node tools/audit_legacy_role_authorization_current.js

      - name: Current release contract
        run: node tools/test_current_release.js

      - name: 84.152 reconciliation contract
        run: node tools/test_reconciliation_84_152.js

      - name: Master and WebView UI contract
        run: node tools/test_master_ui_contract_84_150.js

      - name: WebView logout and garage regression
        run: |
          node tools/build_boot_js_bundles.js --check
          node tools/test_webview_logout_garage_84_151.js
          node tools/test_first_vehicle_account_isolation_84_151.js
          node tools/test_cabinet_session_isolation_84_151.js

      - name: Staging verifier syntax
        run: python3 -m py_compile tools/verify_staging_current.py


      - name: Write Harness receipt
        if: always()
        env:
          KARETA_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KARETA_JOB_STATUS: ${{ job.status }}
        run: |
          node tools/harness_receipt.js \
            --id "verification-gate" \
            --subject-sha "$KARETA_SUBJECT_SHA" \
            --job-status "$KARETA_JOB_STATUS" \
            --output "$RUNNER_TEMP/kareta-harness-receipt.json"

      - name: Upload Harness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-receipt-verification-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/kareta-harness-receipt.json
          if-no-files-found: error
          retention-days: 30
