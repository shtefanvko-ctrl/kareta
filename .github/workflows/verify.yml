name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - import/kareta-current-84.142

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-gate:
    name: verification-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax
        run: |
          find api inc -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/kareta-php-lint.log
          tail -n 20 /tmp/kareta-php-lint.log

      - name: JavaScript syntax
        run: |
          node --check js/next/route_registry.js
          node --check js/next/navigation_core.js
          node --check js/next/role_access.js
          node --check js/next/route_asset_loader.js
          node --check js/next/shell_nav.js
          node --check js/next/app_next.js
          node --check js/next/catalog/catalog_state.js
          node --check js/next/pages/masters.js
          node --check js/next/community/community_state.js
          node --check js/next/pages/community.js
          node --check js/mobile_native_bridge.js
          node --check js/next/pages/diagnostics.js
          node --check js/next/pages/not_found.js
          node --check js/boot/runtime_identity_bundle.js
          node --check js/boot/runtime_shell_bundle.js

      - name: Android Native API 6 contract
        run: node tools/test_android_native_api6_contract_84_148.js

      - name: Migration contract
        run: |
          php tools/test_migration_contract.php
          php tools/test_release_migration_manifest.php
          php tools/test_migration_collision_bridge_84_149.php

      - name: Legacy authorization no-growth
        run: node tools/audit_legacy_role_authorization_current.js

      - name: Boot bundle freshness
        run: node tools/build_boot_js_bundles.js --check

      - name: Navigation integrity
        run: |
          node tools/test_navigation_integrity_84_150.js
          node tools/test_r1885602_contextual_desktop_navigation.js
          node tools/test_master_shell_parity_84_143.js

      - name: Current release contract
        run: node tools/test_current_release_84_150.js

      - name: Staging verifier syntax
        run: python3 -m py_compile tools/verify_staging_current.py

      - name: Package exact release archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/navigation-audit-84.150'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          RELEASE="$(php -r "require 'inc/asset_version.php'; echo KARETA_ASSET_VERSION;")"
          SUFFIX="$(printf '%s' "$RELEASE" | sed 's/^188\.5\.5\.6\.//; s/\./_/g')"
          FULL=".artifacts/KARETA_KZ_FULL_${SUFFIX}.zip"
          FILES=".artifacts/KARETA_KZ_NAVIGATION_FIX_${SUFFIX}_FILES.zip"
          git archive --format=zip --output="$FULL" HEAD
          cat > /tmp/kareta_changed_files.txt <<'EOF'
.github/workflows/verify.yml
docs/changelog/RELEASE_NOTES_84_150.md
docs/release/current.json
inc/asset_registry.php
inc/asset_version.php
js/boot/runtime_shell_bundle.js
js/next/navigation_core.js
js/next/route_asset_loader.js
js/next/shell_nav.js
sw.js
tools/test_current_release_84_150.js
tools/test_master_shell_parity_84_143.js
tools/test_navigation_integrity_84_150.js
tools/test_r1885602_contextual_desktop_navigation.js
EOF
          zip -q "$FILES" -@ < /tmp/kareta_changed_files.txt
          echo "artifact_name=kareta-release-${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload exact release archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/navigation-audit-84.150'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: .artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
