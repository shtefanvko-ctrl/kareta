name: Public landing deploy package

on:
  push:
    branches:
      - ops/public-landing-deploy-20261005

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify current public landing contract
        run: |
          node --check landing/app.js
          node --check landing/config.js
          python3 -m json.tool landing/i18n.json >/dev/null
          test -f .htaccess
          grep -F 'RewriteRule ^$ /landing/ [R=302,L]' .htaccess
          grep -F 'webUrl:"https://m.kareta.kz/"' landing/config.js

      - name: Build deploy package
        run: |
          rm -rf public-landing-deploy
          mkdir -p public-landing-deploy
          cp -R landing public-landing-deploy/landing
          cp .htaccess public-landing-deploy/.htaccess
          cat > public-landing-deploy/DEPLOY_README.txt <<'TXT'
          KARETA.KZ PUBLIC LANDING DEPLOY PACKAGE

          Target:
            kareta.kz / www.kareta.kz public document root only.

          Do NOT upload this package to:
            m.kareta.kz
            s.kareta.kz

          Package contents:
            landing/
            .htaccess
            verify_public_landing.sh

          Safe deploy:
          1. Back up the existing public-domain .htaccess.
          2. Upload landing/ into the public document root.
          3. Replace .htaccess only if the server is intended to match the current Git main contract.
             The host rule redirects only kareta.kz and www.kareta.kz root to /landing/ with HTTP 302.
             m.kareta.kz is not matched by this rule.
          4. Run verify_public_landing.sh from any machine with curl.
          5. Keep 302 until live acceptance is complete.

          Rollback:
          - restore the backed-up .htaccess; or
          - remove the kareta.kz root redirect rule;
          - optionally remove landing/.
          Existing SPA files are not replaced by this package.

          Expected live state:
            https://kareta.kz/           -> 302 /landing/
            https://kareta.kz/landing/  -> KARETA landing
            https://m.kareta.kz/        -> SPA
          TXT
          cat > public-landing-deploy/verify_public_landing.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "[1/4] kareta.kz root redirect"
          headers="$(curl -sS -D - -o /dev/null https://kareta.kz/)"
          echo "$headers" | grep -Eq '^HTTP/.* 302'
          echo "$headers" | grep -Eiq '^location:[[:space:]]*/landing/?'

          echo "[2/4] landing HTML"
          landing="$(curl -fsS https://kareta.kz/landing/)"
          echo "$landing" | grep -Fq 'KARETA.KZ'
          echo "$landing" | grep -Fq 'assets/logo/kareta_logo_full.png'

          echo "[3/4] landing config points to SPA host"
          curl -fsS https://kareta.kz/landing/config.js | grep -Fq 'webUrl:"https://m.kareta.kz/"'

          echo "[4/4] m.kareta.kz remains SPA"
          spa="$(curl -fsS https://m.kareta.kz/)"
          echo "$spa" | grep -Fq 'KARETA.KZ'

          echo "PUBLIC_LANDING_ACCEPTANCE: PASS"
          SH
          chmod +x public-landing-deploy/verify_public_landing.sh
          (cd public-landing-deploy && zip -r ../KARETA_PUBLIC_LANDING_DEPLOY.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: KARETA_PUBLIC_LANDING_DEPLOY
          path: KARETA_PUBLIC_LANDING_DEPLOY.zip
          if-no-files-found: error
          retention-days: 7
