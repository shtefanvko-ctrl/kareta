name: Landing visual smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-visual-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start landing
        run: |
          python3 -m http.server 4173 --directory landing >/tmp/kareta-landing-http.log 2>&1 &
          echo $! >/tmp/kareta-landing-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kareta-landing-http.log
          exit 1

      - name: Browser smoke 390 768 1440
        run: |
          mkdir -p landing-smoke
          cat > /tmp/landing-smoke.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const cases = [
            { name: 'mobile-390x844', width: 390, height: 844 },
            { name: 'tablet-768x1024', width: 768, height: 1024 },
            { name: 'desktop-1440x900', width: 1440, height: 900 }
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const results = [];
            let failed = false;

            for (const c of cases) {
              const context = await browser.newContext({
                viewport: { width: c.width, height: c.height },
                deviceScaleFactor: 1
              });
              const page = await context.newPage();
              const consoleErrors = [];
              const requestFailures = [];

              page.on('console', msg => {
                if (msg.type() === 'error') consoleErrors.push(msg.text());
              });
              page.on('requestfailed', req => {
                requestFailures.push({ url: req.url(), error: req.failure()?.errorText || 'unknown' });
              });

              const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.waitForTimeout(300);

              const base = await page.evaluate(() => {
                const imgs = [...document.images];
                const heroLogo = document.querySelector('.hero-brand-full img');
                const bg = selector => getComputedStyle(document.querySelector(selector)).backgroundImage;
                return {
                  title: document.title,
                  lang: document.documentElement.lang,
                  imageCount: imgs.length,
                  brokenImages: imgs.filter(i => !i.complete || i.naturalWidth === 0).map(i => i.getAttribute('src')),
                  viewportWidth: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  heroLogoWidth: heroLogo ? Math.round(heroLogo.getBoundingClientRect().width) : 0,
                  heroBackground: bg('.hero'),
                  roadBackground: bg('.section--road-bg'),
                  mapBackground: bg('.section--map-bg')
                };
              });

              const langs = [];
              for (const lang of ['kk', 'en', 'ru']) {
                await page.click('[data-lang="' + lang + '"]');
                langs.push(await page.evaluate(() => document.documentElement.lang));
              }

              let menu = null;
              if (c.width <= 1040) {
                await page.click('[data-menu]');
                menu = await page.evaluate(() => {
                  const m = document.querySelector('[data-mobile-nav]');
                  return { hidden: m.hidden, expanded: document.querySelector('[data-menu]').getAttribute('aria-expanded') };
                });
              }

              await page.screenshot({
                path: 'landing-smoke/' + c.name + '.png',
                fullPage: true
              });

              const checks = {
                http200: response && response.status() === 200,
                noBrokenImages: base.brokenImages.length === 0,
                noHorizontalOverflow: base.scrollWidth <= base.viewportWidth + 1,
                fullLogoVisible: base.heroLogoWidth >= (c.width <= 700 ? 250 : 300),
                heroUsesProjectBackground: /assets\/backgrounds\/city-calm-(desktop|mobile)\.png/.test(base.heroBackground),
                roadUsesProjectBackground: /assets\/backgrounds\/road-assist-(desktop|mobile)\.png/.test(base.roadBackground),
                mapUsesProjectBackground: /assets\/backgrounds\/service-map-(desktop|mobile)\.png/.test(base.mapBackground),
                languagesWork: langs.join(',') === 'kk,en,ru',
                mobileMenuWorks: c.width > 1040 || (menu && menu.hidden === false && menu.expanded === 'true'),
                noConsoleErrors: consoleErrors.length === 0,
                noRequestFailures: requestFailures.length === 0
              };

              if (Object.values(checks).some(v => v !== true)) failed = true;

              results.push({
                case: c,
                base,
                langs,
                menu,
                consoleErrors,
                requestFailures,
                checks
              });

              await context.close();
            }

            await browser.close();
            fs.writeFileSync('landing-smoke/report.json', JSON.stringify({ failed, results }, null, 2));
            console.log(JSON.stringify({ failed, results }, null, 2));
            if (failed) process.exit(1);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          node /tmp/landing-smoke.js

      - name: Package standalone landing
        if: always()
        run: |
          zip -r KARETA_LANDING_CANON_FINAL.zip landing

      - name: Upload smoke evidence and ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KARETA_LANDING_CANON_FINAL
          path: |
            landing-smoke/
            KARETA_LANDING_CANON_FINAL.zip
          if-no-files-found: error
          retention-days: 7
