name: DB auto-upgrade reconcile
on:
  pull_request:
    paths:
      - "config.php"
      - "config.private.example.php"
      - "api/bootstrap.php"
      - "api/runtime_diagnostics.php"
      - "tools/test_db_auto_upgrade_reconcile.js"
      - ".github/workflows/db-auto-upgrade-reconcile.yml"
permissions:
  contents: read
jobs:
  db-auto-upgrade-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: php -l config.php
      - run: php -l api/bootstrap.php
      - run: php -l api/runtime_diagnostics.php
      - run: node tools/test_db_auto_upgrade_reconcile.js
