name: Control Center isolated checks
on:
  pull_request:
    paths:
      - 'control-center/**'
      - '.github/workflows/control-center.yml'

permissions:
  contents: read

jobs:
  control-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Go tests, race, vet and build
        working-directory: control-center/backend
        run: |
          test -z "$(gofmt -l *.go)"
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
      - name: Go vulnerability scan
        working-directory: control-center/backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Scan PR commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner --log-opts="$BASE_SHA..HEAD"
      - name: Reproducible frontend build and dependency audit
        working-directory: control-center/frontend
        run: |
          npm ci --ignore-scripts --no-fund
          npm run build
          npm audit --audit-level=low
      - name: Local-only browser smoke
        working-directory: control-center/frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code
