name: Generate Instagram assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/social/generate_instagram_assets.py"
      - ".github/workflows/generate-instagram-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate 12 Instagram posts
        run: python tools/social/generate_instagram_assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/instagram/2026-10
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(social): generate 12 Instagram post folders"
          git push
