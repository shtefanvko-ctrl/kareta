name: staging-verify

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging base URL
        required: true
        default: https://s.kareta.kz

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deployed release
        run: python3 tools/verify_staging_current.py --base-url "${{ inputs.base_url }}"
