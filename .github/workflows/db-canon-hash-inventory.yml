name: DB canon hash inventory
on:
  push:
    branches: [main]
    paths:
      - 'api/migrations/**'
      - 'config.php'
      - 'tools/test_migration_contract.php'
      - '.github/workflows/db-canon-hash-inventory.yml'
  pull_request:
    paths:
      - 'api/migrations/**'
      - 'config.php'
      - 'tools/test_migration_contract.php'
      - '.github/workflows/db-canon-hash-inventory.yml'
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Canonical migration inventory
        shell: bash
        run: |
          php -r '
          $target=144;
          for($v=1;$v<=$target;$v++){
            $prefix=sprintf("%03d_",$v);
            $matches=glob("api/migrations/".$prefix."*.php") ?: [];
            if(count($matches)!==1){
              fwrite(STDERR,"VERSION ".$v." MATCHES ".count($matches)." ".implode(",",$matches).PHP_EOL);
              exit(1);
            }
            $file=basename($matches[0]);
            echo $v."|".$file."|".hash_file("sha256",$matches[0]).PHP_EOL;
          }'
      - name: PHP migration contract
        run: php tools/test_migration_contract.php
