name: Native bridge asset contract

on:
  pull_request:
    paths:
      - 'inc/asset_registry.php'
      - 'asset_manifest.php'
      - 'index.php'
      - 'js/mobile_native_bridge.js'
      - 'tools/test_native_bridge_asset_contract.js'
      - '.github/workflows/native-bridge-asset-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_HEAD: $actual"

      - name: Syntax
        run: |
          php -l inc/asset_registry.php
          php -l asset_manifest.php
          node --check tools/test_native_bridge_asset_contract.js

      - name: Registry ownership
        run: |
          php -r 'require "inc/asset_registry.php"; $r=kareta_asset_registry(); $s=$r["standaloneScripts"]??[]; if($s!==["js/mobile_native_bridge.js"]) {fwrite(STDERR,"standaloneScripts mismatch\n"); exit(1);} if(in_array("js/mobile_native_bridge.js",$r["scripts"]??[],true)){fwrite(STDERR,"bridge must not be duplicated in atomic boot scripts\n"); exit(1);} echo "STANDALONE_BRIDGE_REGISTRY: PASS\n";'

      - name: Manifest contract
        run: node tools/test_native_bridge_asset_contract.js
