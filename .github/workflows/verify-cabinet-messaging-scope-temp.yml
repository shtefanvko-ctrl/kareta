name: Verify cabinet messaging scope

on:
  push:
    branches:
      - perf/cabinet-settings-lazy-messaging-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cabinet messaging lazy contract
        run: node tools/test_cabinet_settings_lazy_messaging.js
      - name: Route lazy loader 84.66
        run: node tools/test_route_lazy_loader_84_66.js
      - name: Route lazy runtime 84.68
        run: node tools/test_route_lazy_runtime_84_68.js
      - name: Master cleanup compatibility
        run: node tools/test_master_ui_cleanup_84_99.js
      - name: Syntax
        run: |
          php -l inc/asset_registry.php
          php -l tools/release_gate.php
          node --check tools/test_cabinet_settings_lazy_messaging.js
