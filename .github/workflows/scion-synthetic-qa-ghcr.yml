# Intentionally manual and QA-only. NEVER deploys Kubernetes or CARAT/Scion.
# Do not merge until the scion-qa-ghcr-approval environment has REQUIRED reviewers.
name: Scion QA - sign synthetic OCI artifact

on:
  workflow_dispatch:
    inputs:
      qa_publish_ack:
        description: "Type PUBLISH_SYNTHETIC_QA_ONLY to authorize QA image publication"
        type: string
        required: true

permissions: {}

concurrency:
  group: scion-synthetic-qa-image
  cancel-in-progress: false

jobs:
  build-sign-qa:
    if: ${{ github.ref == 'refs/heads/main' && inputs.qa_publish_ack == 'PUBLISH_SYNTHETIC_QA_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: scion-qa-ghcr-approval
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kareta-scion-synthetic-qa
      TAG: qa-${{ github.sha }}
    steps:
      - name: Checkout exact ref without persistent credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: infra/scion-worker-qa/go.mod
          cache: false

      - name: Verify and build the synthetic-only binary
        working-directory: infra/scion-worker-qa
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o scion-worker .
          test -x scion-worker

      - name: Authenticate to GHCR with repository-scoped GitHub token
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish synthetic QA image only
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./infra/scion-worker-qa
          file: ./infra/scion-worker-qa/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            dev.kareta.scion.scope=QA_SYNTHETIC_ONLY
            dev.kareta.scion.production-release=DENY
          provenance: mode=max

      - name: Install verified Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable digest with ephemeral GitHub OIDC identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Independently verify signed digest and workflow identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKFLOW_ID: https://github.com/${{ github.repository }}/.github/workflows/scion-synthetic-qa-ghcr.yml@refs/heads/main
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign verify \
            --certificate-identity "${WORKFLOW_ID}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          echo "QA_SYNTHETIC_IMAGE=${IMAGE}@${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          echo "WORKER_ADMISSION=DENY" >> "${GITHUB_STEP_SUMMARY}"
