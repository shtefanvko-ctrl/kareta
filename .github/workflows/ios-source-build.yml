name: iOS source build

on:
  push:
    branches:
      - ios/kareta-2026-10-01
    paths:
      - "ios/**"
      - "api/obd.php"
      - "api/mobile_push.php"
      - "api/mobile_push_send.php"
      - "api/auth_session.php"
      - "js/next/pages/diagnostics.js"
      - "tools/test_ios_*.js"
      - ".github/workflows/ios-source-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - name: PHP 8.1 syntax
        run: |
          php -l api/obd.php
          php -l api/mobile_push.php
          php -l api/mobile_push_send.php
          php -l api/auth_session.php
      - name: Bridge parity
        run: node tools/test_ios_bridge_contract.js
      - name: Native phase 2
        run: node tools/test_ios_native_phase2.js
      - name: Native phase 3
        run: node tools/test_ios_native_phase3.js
      - name: BLE ELM contract
        run: node tools/test_ios_elm_contract.js
      - name: OBD provenance
        run: node tools/test_ios_obd_provenance.js
      - name: iOS push contract
        run: node tools/test_ios_push_contract.js

  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate canonical AppIcon
        run: bash tools/generate_ios_appicon.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/KaretaIOS.xcodeproj
          -scheme KaretaIOS
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
