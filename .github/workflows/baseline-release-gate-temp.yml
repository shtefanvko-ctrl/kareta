name: Baseline release gate probe

on:
  push:
    branches:
      - fix/release-parity-84-142-20260930

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full release gate
        run: php tools/release_gate.php --package=full
