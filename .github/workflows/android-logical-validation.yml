name: Android logical validation 84.153

on:
  push:
    branches:
      - validate/android-logical-84.153
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-logical-84-153-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logical-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run logical Android/WebView validation
        env:
          KARETA_SUBJECT_SHA: ${{ github.sha }}
          KARETA_RELEASE_CANDIDATE_SHA: 4d969dbd9c779f4722a4afc4acf087f2eaba2948
        run: node tools/run_android_logical_validation_84_153.js artifacts/android-logical-84.153.json

      - name: Upload logical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logical-evidence-84.153-${{ github.sha }}
          path: artifacts/android-logical-84.153.json
          if-no-files-found: error
          retention-days: 30
