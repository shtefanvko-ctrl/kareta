name: Sync lazy account window core bundle

on:
  push:
    branches:
      - perf/lazy-account-window-20261001

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild runtime bundles
        run: |
          node tools/build_boot_js_bundles.js
          git checkout -- js/boot/runtime_onboarding_bundle.js js/boot/runtime_identity_bundle.js js/boot/runtime_shell_bundle.js js/boot/runtime_ui_bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/boot/runtime_core_bundle.js
          if git diff --cached --quiet; then
            echo "runtime_core_bundle.js already synchronized"
          else
            git commit -m "build(core): sync lazy account window extraction"
            git push origin HEAD:perf/lazy-account-window-20261001
            exit 0
          fi
      - name: Lazy account window regression
        run: node tools/test_lazy_account_window_boot.js
      - name: Cabinet messaging scope regression
        run: node tools/test_cabinet_settings_lazy_messaging.js
      - name: Route lazy runtime 84.68
        run: node tools/test_route_lazy_runtime_84_68.js
      - name: Syntax
        run: |
          node --check js/next/account_window.js
          node --check js/boot/runtime_core_bundle.js
          node --check tools/test_lazy_account_window_boot.js
          php -l inc/asset_registry.php
