name: AI governance

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'MB_MONITORING.md'
      - 'ai/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/ai-governance.yml'
      - '.github/workflows/php-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'MB_MONITORING.md'
      - 'ai/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/ai-governance.yml'
      - '.github/workflows/php-syntax.yml'

jobs:
  context-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required AI context files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            CLAUDE.md
            MB_MONITORING.md
            ai/CONTEXT_ROUTER.md
            ai/WORKFLOW.md
            ai/VERIFICATION_GATES.md
            ai/rules/architecture.md
            ai/rules/security.md
            ai/rules/verification-release.md
            .github/copilot-instructions.md
            .github/workflows/php-syntax.yml
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Keep root kernel compact
        shell: bash
        run: |
          set -euo pipefail
          lines=$(wc -l < AGENTS.md)
          echo "AGENTS.md lines: $lines"
          test "$lines" -le 120 || {
            echo "AGENTS.md exceeded 120 lines. Move domain detail into routed modules."
            exit 1
          }

      - name: Verify source-of-truth links
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ai/CONTEXT_ROUTER.md' AGENTS.md
          grep -q 'MB_MONITORING.md' AGENTS.md
          grep -q 'AGENTS.md' CLAUDE.md
          grep -q 'AGENTS.md' .github/copilot-instructions.md
          grep -q 'MB_MONITORING.md' ai/rules/verification-release.md
          grep -q 'ai/VERIFICATION_GATES.md' ai/rules/verification-release.md
          grep -q 'MB_MONITORING.md' ai/VERIFICATION_GATES.md
          grep -q '.github/workflows/php-syntax.yml' ai/VERIFICATION_GATES.md
          echo 'AI context routing and executable gate contracts are internally linked.'
