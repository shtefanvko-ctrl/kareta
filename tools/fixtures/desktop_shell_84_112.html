<script>addEventListener('load',()=>{const q=s=>document.querySelector(s),rect=s=>{const n=q(s);if(!n)return null;const r=n.getBoundingClientRect(),c=getComputedStyle(n);return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:c.display,position:c.position}},root=document.documentElement,st=getComputedStyle(root),w=root.clientWidth,expected=w>=1280?248:w>=1024?84:0,state={width:w,height:root.clientHeight,scrollWidth:root.scrollWidth,overflowX:root.scrollWidth>root.clientWidth+1,header:rect('#k-shell-header'),sidebar:rect('#k-desktop-sidebar'),desktopNav:rect('#k-desktop-nav'),mobileNav:rect('#k-mobile-nav'),outlet:rect('#k-page-outlet'),fullLogo:rect('.k-brand-logo--full'),iconLogo:rect('.k-brand-logo--icon'),pageMax:st.getPropertyValue('--k-page-max').trim(),sidebarW:st.getPropertyValue('--k-desktop-sidebar-w').trim(),expected};state.pass=!state.overflowX&&state.pageMax==='1440px'&&state.sidebar&&state.sidebar.display!=='none'&&Math.abs(state.sidebar.w-expected)<=1&&state.mobileNav&&state.mobileNav.display==='none'&&state.outlet&&state.outlet.x>=expected&&state.outlet.w<=1440;document.body.dataset.pass=state.pass?'1':'0';document.body.dataset.sidebar=String(state.sidebar?.w||0);document.body.dataset.outlet=String(state.outlet?.w||0);document.body.dataset.viewport=String(w);q('#fixture-result').textContent=JSON.stringify(state)});</script>
