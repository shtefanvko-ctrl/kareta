plugins { id 'com.android.application' }

android {
    namespace 'kz.kareta.adminassistant'
    compileSdk 36

    defaultConfig {
        applicationId 'kz.kareta.adminassistant'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.0.0.3'
        buildConfigField 'String', 'CHAT_URL', '"https://kareta.kz/ai/"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
