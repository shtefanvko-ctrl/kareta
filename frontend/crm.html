<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kareta CRM</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: #f8fafc;
      }
      .crm-layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 2rem;
        padding: 3rem 5vw;
      }
      .crm-panel {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 15px 30px rgba(15, 23, 42, 0.1);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      }
      th {
        background: rgba(15, 23, 42, 0.04);
        font-weight: 600;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border-radius: 999px;
        padding: 0.2rem 0.85rem;
        font-size: 0.85rem;
      }
      .status-new {
        background: rgba(59, 130, 246, 0.12);
        color: #1d4ed8;
      }
      .status-converted {
        background: rgba(34, 197, 94, 0.15);
        color: #15803d;
      }
      .status-in-progress {
        background: rgba(249, 115, 22, 0.12);
        color: #b45309;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        gap: 1rem;
      }
      .toolbar input,
      .toolbar select {
        flex: 1;
      }
      .muted {
        color: rgba(15, 23, 42, 0.6);
        font-size: 0.85rem;
      }
      @media (max-width: 960px) {
        .crm-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="crm-layout">
      <aside class="crm-panel">
        <h2>Добавить программу</h2>
        <form id="program-form" class="grid">
          <label>
            Название
            <input type="text" name="name" required />
          </label>
          <label>
            Продолжительность (мес.)
            <input type="number" name="duration_months" min="1" max="60" required />
          </label>
          <label>
            Описание
            <textarea name="description" required></textarea>
          </label>
          <button class="btn" type="submit">Сохранить программу</button>
        </form>
        <hr />
        <h2>Быстрая заявка</h2>
        <form id="lead-quick-form" class="grid">
          <label>
            Имя
            <input type="text" name="name" required />
          </label>
          <label>
            Эл. почта
            <input type="email" name="email" required />
          </label>
          <label>
            Телефон
            <input type="tel" name="phone" />
          </label>
          <label>
            Программа
            <select name="preferred_program_id" id="lead-program-select">
              <option value="">Выберите программу</option>
            </select>
          </label>
          <label>
            Комментарий
            <textarea name="notes"></textarea>
          </label>
          <button class="btn" type="submit">Создать заявку</button>
        </form>
        <div id="side-alert" class="alert" hidden></div>
      </aside>
      <main class="crm-panel">
        <div class="toolbar">
          <h1>Панель CRM</h1>
          <label class="muted">
            API URL
            <input type="url" id="api-url" placeholder="http://localhost:8000" />
          </label>
        </div>
        <section>
          <h3>Заявки</h3>
          <table>
            <thead>
              <tr>
                <th>Имя</th>
                <th>Контакты</th>
                <th>Программа</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="lead-table"></tbody>
          </table>
        </section>
        <section>
          <h3>Студенты</h3>
          <table>
            <thead>
              <tr>
                <th>ФИО</th>
                <th>Email</th>
                <th>Телефон</th>
                <th>Программа</th>
                <th>Статус</th>
              </tr>
            </thead>
            <tbody id="student-table"></tbody>
          </table>
        </section>
      </main>
    </div>
    <script src="crm.js" type="module"></script>
  </body>
</html>
